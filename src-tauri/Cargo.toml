[package]
name = "island-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
serde_json = "1.0"

[dependencies]
island-contract = { path = "../crates/island-contract" }
island-core = { path = "../crates/island-core" }
island-store = { path = "../crates/island-store" }
island-secrets = { path = "../crates/island-secrets" }
island-server = { path = "../crates/island-server" }
island-platform = { path = "../crates/island-platform" }
source-desktop = { path = "../crates/sources/source-desktop" }
source-gmail = { path = "../crates/sources/source-gmail" }
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Security"
] }
